<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#060608">
<title>FAQ and contact — TECHFEST '27</title>
<meta name="description" content="Answers to common questions about TECHFEST '27, and a form to contact the organisers.">
<link rel="preload" href="/fonts/bricolage-grotesque.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/inter.woff2" as="font" type="font/woff2" crossorigin>
</head>
<body>
<main id="main">
  <header class="pagehead">
    <div class="wrap">
      <p class="crumb"><a href="/">Home</a> / FAQ</p>
      <h1>Questions, <em>answered</em></h1>
      <p class="lede">Can't find what you need? Send the organisers a message using the form.</p>
    </div>
  </header>
  <section class="wrap pagebody">
    <div class="faqgrid">
      <div class="faq" data-faq></div>
      <form class="panel formcard" data-form novalidate>
        <h2>Contact the organisers</h2>
        <div class="field"><label for="c-name">Your name</label><input id="c-name" name="name" autocomplete="name"><p class="field__err" data-err="name"></p></div>
        <div class="field"><label for="c-email">Email</label><input id="c-email" name="email" type="email" autocomplete="email"><p class="field__err" data-err="email"></p></div>
        <div class="field"><label for="c-msg">Message</label><textarea id="c-msg" name="message"></textarea><p class="field__err" data-err="message"></p></div>
        <button class="btn btn--lime btn--lg" type="submit">Send message</button>
        <p class="status" data-status role="status" aria-live="polite"></p>
      </form>
    </div>
  </section>
</main>
<script type="module" src="/src/pages/faq.js"></script>
</body>
</html>
