<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#060608">
<title>Log in — TECHFEST '27</title>
<meta name="description" content="Log in to your TECHFEST '27 account.">
<link rel="preload" href="/fonts/bricolage-grotesque.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/inter.woff2" as="font" type="font/woff2" crossorigin>
</head>
<body>
<main id="main">
  <div class="wrap authwrap">
    <div class="auth">
      <div class="auth__intro">
        <p class="eyebrow">Welcome back</p>
        <h1>Log in to your <em>profile</em></h1>
        <p class="lede">See your registrations, edit your public profile and track your badges.</p>
        <div class="demo"><span>Demo account:</span><code>demo@techfest.dev</code><code>password123</code><button class="btn btn--sm" type="button" data-demo>Fill it in</button></div>
      </div>
      <form class="panel formcard" data-form novalidate>
        <div class="field"><label for="l-email">Email</label><input id="l-email" name="email" type="email" autocomplete="email"><p class="field__err" data-err="email"></p></div>
        <div class="field"><label for="l-pw">Password</label><input id="l-pw" name="password" type="password" autocomplete="current-password"><p class="field__err" data-err="password"></p></div>
        <button class="btn btn--lime btn--lg" type="submit">Log in</button>
        <p class="status" data-status role="status" aria-live="polite"></p>
        <p class="status">New here? <a class="link" href="/register.html" data-reg-link>Create an account</a></p>
      </form>
    </div>
  </div>
</main>
<script type="module" src="/src/pages/login.js"></script>
</body>
</html>
