<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#060608">
<title>Dashboard — TECHFEST '27</title>
<meta name="description" content="Your TECHFEST '27 dashboard: registrations, badges and profile customization.">
<link rel="preload" href="/fonts/bricolage-grotesque.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/inter.woff2" as="font" type="font/woff2" crossorigin>
</head>
<body>
<main id="main">
  <header class="pagehead">
    <div class="wrap">
      <p class="crumb"><a href="/">Home</a> / Dashboard</p>
      <h1 data-hello>Your <em>dashboard</em></h1>
    </div>
  </header>
  <section class="wrap dash">
    <nav class="panel dash__nav" role="tablist" aria-label="Dashboard sections" data-tabs>
      <button type="button" role="tab" data-tab="overview" aria-selected="true">Overview</button>
      <button type="button" role="tab" data-tab="profile" aria-selected="false">Customize profile</button>
      <button type="button" role="tab" data-tab="account" aria-selected="false">Account</button>
    </nav>
    <div data-panels>
      <div class="dash__sec" data-panel="overview"></div>
      <div class="dash__sec" data-panel="profile" hidden></div>
      <div class="dash__sec" data-panel="account" hidden></div>
    </div>
  </section>
</main>
<script type="module" src="/src/pages/dashboard.js"></script>
</body>
</html>
