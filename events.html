<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#060608">
<title>Events — TECHFEST '27</title>
<meta name="description" content="All events at TECHFEST '27: hackathon, robowars, quiz, data challenge, design sprint, CTF and more. Search, filter and register.">
<link rel="preload" href="/fonts/bricolage-grotesque.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/inter.woff2" as="font" type="font/woff2" crossorigin>
</head>
<body>
<main id="main">
  <header class="pagehead">
    <div class="wrap">
      <p class="crumb"><a href="/">Home</a> / Events</p>
      <h1>All <em>events</em></h1>
      <p class="lede">Search, filter by category and register in one click. The site warns you if two events start at the same time.</p>
    </div>
  </header>
  <section class="wrap pagebody">
    <div class="toolbar">
      <label class="search"><span class="vh" hidden>Search events</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input type="search" data-q placeholder="Search events, e.g. robot or hackathon" aria-label="Search events"></label>
      <select class="select" data-sort aria-label="Sort events">
        <option value="time">Sort: Start time</option>
        <option value="prize">Sort: Prize, high to low</option>
        <option value="spots">Sort: Most spots left</option>
      </select>
    </div>
    <div class="pills" data-pills role="group" aria-label="Filter by category"></div>
    <p class="count" data-count aria-live="polite"></p>
    <div class="egrid" data-grid></div>
    <div class="empty" data-empty hidden>No events match your search. Try a different word or category.</div>
  </section>
</main>
<script type="module" src="/src/pages/events.js"></script>
</body>
</html>
