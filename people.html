<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#060608">
<title>People — TECHFEST '27</title>
<meta name="description" content="Browse the public profiles of TECHFEST '27 participants: skills, projects and the events they joined.">
<link rel="preload" href="/fonts/bricolage-grotesque.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/inter.woff2" as="font" type="font/woff2" crossorigin>
</head>
<body>
<main id="main">
  <header class="pagehead">
    <div class="wrap">
      <p class="crumb"><a href="/">Home</a> / People</p>
      <h1>The <em>community</em></h1>
      <p class="lede">Every participant has their own customizable profile. Find teammates by skill, college or name.</p>
    </div>
  </header>
  <section class="wrap pagebody">
    <div class="toolbar">
      <label class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input type="search" data-q placeholder="Search by name, college or headline" aria-label="Search people"></label>
      <select class="select" data-skill aria-label="Filter by skill"><option value="">All skills</option></select>
    </div>
    <p class="count" data-count aria-live="polite"></p>
    <div class="pgrid" data-grid></div>
    <div class="empty" data-empty hidden>Nobody matches that search.</div>
  </section>
</main>
<script type="module" src="/src/pages/people.js"></script>
